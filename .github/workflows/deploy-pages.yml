name: Publikacja w GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Budowanie strony
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4
      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalacja zależności
        run: npm ci
      - name: Sprawdzenie typów
        run: npm run typecheck
      - name: Testy jednostkowe
        run: npm test
      - name: Budowanie aplikacji
        run: npm run build
      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5
      - name: Przygotowanie artefaktu
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publikacja strony
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
