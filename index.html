<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interaktywna mapa 3D terenu w promieniu 200 metrów wokół ronda Rataje w Poznaniu." />
    <title>Rondo Rataje · 200 m</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Interaktywna mapa 3D ronda Rataje"></canvas>
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">POZNAŃ · 52.395556° N, 16.950278° E</p>
        <h1 id="title">Rondo<br />Rataje</h1>
        <p class="lede"><span>200 m</span> mierzonego terenu, dróg, zabudowy i zieleni z deterministyczną symulacją ruchu.</p>
      </section>
      <section class="controls" aria-label="Sterowanie mapą">
        <div class="view-buttons">
          <button type="button" data-action="reset">Widok ukośny</button>
          <button type="button" data-action="top">Widok z góry</button>
        </div>
        <fieldset>
          <legend>Warstwy</legend>
          <label><input type="checkbox" data-layer="terrain" checked /><span>Teren</span></label>
          <label><input type="checkbox" data-layer="transport" checked /><span>Drogi i trasy</span></label>
          <label><input type="checkbox" data-layer="buildings" checked /><span>Budynki <output id="building-count">—</output></span></label>
          <label><input type="checkbox" data-layer="stations" checked /><span>Przystanki <output id="station-count">—</output></span></label>
          <label><input type="checkbox" data-layer="trees" checked /><span>Drzewa <output id="tree-count">—</output></span></label>
          <label><input type="checkbox" data-layer="traffic" checked /><span>Ruch <output id="traffic-count">—</output></span></label>
        </fieldset>
        <fieldset class="traffic-controls">
          <legend>Symulacja</legend>
          <button type="button" data-action="traffic-toggle" aria-pressed="false">Wstrzymaj ruch</button>
          <div class="density-buttons" aria-label="Natężenie ruchu">
            <button type="button" data-density="low" aria-pressed="false">Małe</button>
            <button type="button" data-density="medium" aria-pressed="true">Średnie</button>
            <button type="button" data-density="high" aria-pressed="false">Duże</button>
          </div>
        </fieldset>
        <label class="exaggeration"><input type="checkbox" data-action="exaggerate" /><span>Teren ×3</span></label>
      </section>
      <aside id="details" class="details" aria-live="polite" hidden></aside>
      <div class="north" aria-hidden="true"><span>N</span><i></i></div>
      <p id="status" class="status">Wczytywanie sceny…</p>
      <footer>
        <span>Dane: <a href="https://www.geoportal.gov.pl/pl/dane/numeryczny-model-terenu-nmt/" target="_blank" rel="noreferrer">GUGiK</a> · <a href="https://geopoz.poznan.pl/geo/aktualnosci/1719%2CRoslinnosc-w-Modelu-3D.html" target="_blank" rel="noreferrer">GEOPOZ / Miasto Poznań</a></span>
        <span>Dane pomiarowe · autorska symulacja, nie obraz ruchu na żywo</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
